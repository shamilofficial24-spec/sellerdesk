<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SellerDesk P&L</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f1115;
      color: #fff;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .header {
      background: linear-gradient(135deg, #191919, #2a2115);
      border: 1px solid #3c2f1d;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #f5d7a1;
      font-size: 30px;
    }

    .header p {
      color: #bdbdbd;
      margin-top: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: #1b1d22;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 18px;
    }

    .summary-card span {
      color: #aaa;
      font-size: 13px;
    }

    .summary-card h2 {
      margin: 8px 0 0;
      font-size: 24px;
      color: #2ee68a;
    }

    .section-title {
      color: #f5d7a1;
      margin: 25px 0 14px;
      font-size: 24px;
    }

    .category-grid {
      display: grid;
      gap: 16px;
    }

    .card {
      background: #1b1d22;
      border: 1px solid #383020;
      border-radius: 22px;
      padding: 20px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card h3 {
      margin: 0;
      font-size: 22px;
      color: #ffe7b5;
    }

    .profit {
      font-size: 22px;
      font-weight: bold;
      color: #2ee68a;
    }

    .loss {
      color: #ff5c5c;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .item {
      background: #121317;
      border: 1px solid #332818;
      border-radius: 14px;
      padding: 13px;
    }

    .item label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .item input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #d8a84f;
      color: #111;
    }

    .reset {
      background: #292929;
      color: #fff;
      border: 1px solid #444;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .card-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>SellerDesk P&L</h1>
      <p>Track sales, cost, ads, shipping, returns and profit by business channel.</p>
    </div>

    <div class="summary">
      <div class="summary-card">
        <span>Total Sales</span>
        <h2 id="totalSales">₹0</h2>
      </div>

      <div class="summary-card">
        <span>Total Cost</span>
        <h2 id="totalCost">₹0</h2>
      </div>

      <div class="summary-card">
        <span>Total Expense</span>
        <h2 id="totalExpense">₹0</h2>
      </div>

      <div class="summary-card">
        <span>Net Profit</span>
        <h2 id="netProfit">₹0</h2>
      </div>
    </div>

    <h2 class="section-title">Category P&L</h2>

    <div class="category-grid" id="categoryGrid"></div>

    <div class="buttons">
      <button class="save" onclick="saveData()">Save Data</button>
      <button class="reset" onclick="resetData()">Reset All</button>
    </div>

  </div>

  <script>
    const categories = [
      {
        name: "Amazon",
        fields: ["Sales", "Product Cost", "Amazon Fees", "Ads", "Shipping", "Returns"]
      },
      {
        name: "Ukashi Website",
        fields: ["Sales", "Product Cost", "Meta Ads", "Shipping", "Payment Fee", "Returns"]
      },
      {
        name: "WhatsApp / Direct",
        fields: ["Sales", "Product Cost", "Delivery", "Packaging", "Returns"]
      },
      {
        name: "India Dropshipping",
        fields: ["Sales", "Product Cost", "Ads", "Shipping", "COD Charges", "Returns"]
      },
      {
        name: "US Dropshipping",
        fields: ["Sales", "Product Cost", "Ad Spend", "Platform Fee", "Refunds"]
      }
    ];

    let data = JSON.parse(localStorage.getItem("sellerdeskData")) || {};

    function formatMoney(value) {
      return "₹" + Number(value || 0).toLocaleString("en-IN");
    }

    function renderCards() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";

      categories.forEach((cat, catIndex) => {
        if (!data[cat.name]) data[cat.name] = {};

        const card = document.createElement("div");
        card.className = "card";

        let inputs = "";

        cat.fields.forEach(field => {
          const value = data[cat.name][field] || "";
          inputs += `
            <div class="item">
              <label>${field}</label>
              <input 
                type="number" 
                value="${value}" 
                oninput="updateValue('${cat.name}', '${field}', this.value)"
                placeholder="0"
              />
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-top">
            <h3>${cat.name}</h3>
            <div class="profit" id="profit-${catIndex}">₹0</div>
          </div>

          <div class="items">
            ${inputs}
          </div>
        `;

        grid.appendChild(card);
      });

      calculateTotals();
    }

    function updateValue(category, field, value) {
      data[category][field] = Number(value);
      calculateTotals();
    }

    function calculateTotals() {
      let totalSales = 0;
      let totalCost = 0;
      let totalExpense = 0;
      let netProfit = 0;

      categories.forEach((cat, index) => {
        const sales = Number(data[cat.name]?.["Sales"] || 0);
        let expenses = 0;

        cat.fields.forEach(field => {
          if (field !== "Sales") {
            expenses += Number(data[cat.name]?.[field] || 0);
          }
        });

        const profit = sales - expenses;

        totalSales += sales;
        totalCost += Number(data[cat.name]?.["Product Cost"] || 0);
        totalExpense += expenses - Number(data[cat.name]?.["Product Cost"] || 0);
        netProfit += profit;

        const profitBox = document.getElementById("profit-" + index);
        if (profitBox) {
          profitBox.textContent = formatMoney(profit);
          profitBox.className = profit >= 0 ? "profit" : "profit loss";
        }
      });

      document.getElementById("totalSales").textContent = formatMoney(totalSales);
      document.getElementById("totalCost").textContent = formatMoney(totalCost);
      document.getElementById("totalExpense").textContent = formatMoney(totalExpense);
      document.getElementById("netProfit").textContent = formatMoney(netProfit);
      document.getElementById("netProfit").className = netProfit >= 0 ? "" : "loss";
    }

    function saveData() {
      localStorage.setItem("sellerdeskData", JSON.stringify(data));
      alert("Data saved successfully");
    }

    function resetData() {
      if (confirm("Are you sure you want to reset all data?")) {
        localStorage.removeItem("sellerdeskData");
        data = {};
        renderCards();
      }
    }

    renderCards();
  </script>
</body>
</html>
